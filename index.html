<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Blue Wave · World Cup Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            background: #eef3fc;
            min-height: 100vh;
        }

        /* LANDING PAGE */
        #landingPage {
            display: block;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #001e3c, #002b54);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .banner-container {
            max-width: 500px;
            width: 100%;
            border-radius: 32px;
            overflow: hidden;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .enter-btn {
            background: #ffcd3c;
            border: none;
            width: 100%;
            max-width: 320px;
            margin: 30px auto 0;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #00264d;
            border-radius: 60px;
            cursor: pointer;
        }
        .enter-btn:hover { background: #ffdd77; transform: scale(0.98); }

        /* APP WRAPPER */
        #appWrapper {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background: #f8fafd;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .app-header {
            background: #002b54;
            padding: 16px;
            text-align: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .app-header h2 { font-size: 1.5rem; letter-spacing: 1px; }
        .app-header p { font-size: 0.75rem; opacity: 0.85; }

        /* MAIN NAV GRID */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
            background: white;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 70px;
            z-index: 9;
        }
        .nav-btn {
            background: #f1f5f9;
            border: none;
            padding: 12px 4px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 12px;
            color: #002b54;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .nav-btn.active {
            background: #002b54;
            color: white;
        }

        /* SECTIONS */
        .section {
            display: none;
            padding: 16px;
        }
        .section.active-section { display: block; }

        .card {
            background: white;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #002b54;
            border-left: 5px solid #ffcd3c;
            padding-left: 12px;
            margin-bottom: 16px;
        }

        /* MATCH ITEMS */
        .match-item {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .match-date { font-size: 11px; color: #2c6e9e; font-weight: 600; }
        .match-teams {
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .match-score { background: #e9f0f9; padding: 4px 12px; border-radius: 40px; }

        /* STANDINGS TABLE */
        .standings-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .standings-table th { background: #002b54; color: white; padding: 8px 4px; text-align: center; }
        .standings-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .standings-table tr:hover { background: #f1f5f9; }
        .group-header { background: #ffcd3c; color: #002b54; font-weight: 800; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; }

        /* DAILY PROMOS */
        .promo-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .promo-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .promo-card .promo-info {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .promo-card .promo-name { font-weight: 700; color: #002b54; }
        .promo-card .promo-link { color: #2c6e9e; font-size: 12px; cursor: pointer; }

        /* CALENDAR */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin: 12px 0;
        }
        .calendar-day {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 8px 0;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .calendar-day.selected { background: #ffcd3c; font-weight: 800; }
        .calendar-day.has-promo { border: 2px solid #25d366; }

        /* ADD PROMO FORM */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #ddd;
            font-family: inherit; font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .char-count { text-align: right; font-size: 11px; color: #888; }
        .submit-btn {
            background: #ffcd3c; color: #002b54; border: none; padding: 14px;
            border-radius: 40px; font-weight: 700; width: 100%; cursor: pointer;
        }

        /* SILVER SCROLLING FOOTER */
        .silver-frame {
            background: #002b54;
            padding: 12px;
            overflow: hidden;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            z-index: 20;
        }
        .silver-scroll {
            display: flex;
            gap: 36px;
            white-space: nowrap;
            animation: scrollMarquee 22s linear infinite;
        }
        .silver-item { color: #ffdd99; font-size: 13px; }
        @keyframes scrollMarquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }

        .loading { text-align: center; padding: 28px; color: #888; }
    </style>
</head>
<body>

<!-- LANDING PAGE (only banner) -->
<div id="landingPage">
    <div class="banner-container">
        <img src="https://i.ibb.co/KxtD3C2w/banner-world-cup-app.png" alt="Blue Wave 2026">
    </div>
    <button class="enter-btn" id="enterAppBtn">⚽ SEE MATCH RESULTS ⚽</button>
</div>

<!-- MAIN APP -->
<div id="appWrapper">
    <div class="app-header">
        <h2>🌊 BLUE WAVE 2026</h2>
        <p>Curaçao World Cup Tracker</p>
    </div>

    <!-- Navigation Grid -->
    <div class="nav-grid">
        <button class="nav-btn" data-section="results">📋 Results</button>
        <button class="nav-btn" data-section="today">📅 Today</button>
        <button class="nav-btn" data-section="standings">🏆 Group E</button>
        <button class="nav-btn" data-section="nextround">⚡ Next Round</button>
        <button class="nav-btn" data-section="facts">📖 Facts</button>
        <button class="nav-btn" data-section="promos">🔥 Daily Promos</button>
    </div>

    <!-- SECTIONS -->
    <div id="section-results" class="section active-section">
        <div class="card"><div class="card-title">📋 All Results</div><div id="resultsContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-today" class="section">
        <div class="card"><div class="card-title">📅 Today's Matches</div><div id="todayContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-standings" class="section">
        <div class="card"><div class="card-title">🏆 Group E Standings</div><div id="standingsContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-nextround" class="section">
        <div class="card"><div class="card-title">⚡ Next Round</div><div id="nextroundContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-facts" class="section">
        <div class="card"><div class="card-title">📖 Facts</div><div id="factsContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-promos" class="section">
        <div class="card">
            <div class="card-title">🔥 Daily Promos</div>
            <!-- Calendar -->
            <div id="calendarContainer"></div>
            <!-- Promos for selected date -->
            <div id="promoList" class="loading">Select a date</div>
            <!-- Add Promo Button -->
            <button id="showAddPromoBtn" style="margin-top:12px; background:#002b54; color:white; border:none; padding:12px; border-radius:40px; width:100%; font-weight:700; cursor:pointer;">➕ Add Promo</button>
            <!-- Add Promo Form (hidden initially) -->
            <div id="addPromoForm" style="display:none; margin-top:16px; background:#f1f5f9; padding:16px; border-radius:16px;">
                <div class="form-group">
                    <label>Date (YYYY-MM-DD)</label>
                    <input type="date" id="promoDate" value="2026-06-17">
                </div>
                <div class="form-group">
                    <label>Sponsor Name</label>
                    <input type="text" id="promoName" placeholder="John's Pizza">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="promoImage" placeholder="https://i.ibb.co/...">
                </div>
                <div class="form-group">
                    <label>Link (WhatsApp or website)</label>
                    <input type="url" id="promoLink" placeholder="https://wa.me/...">
                </div>
                <div class="form-group">
                    <label>Message (100 char limit, XCG 75 for unlimited)</label>
                    <textarea id="promoMessage" maxlength="100" placeholder="Special offer!"></textarea>
                    <div class="char-count"><span id="charCount">0</span>/100</div>
                </div>
                <button class="submit-btn" id="submitPromoBtn">📤 Send Request via WhatsApp</button>
                <button style="margin-top:8px; background:transparent; border:none; color:#888; cursor:pointer; width:100%;" id="cancelPromoBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Silver Shoutouts (fixed footer) -->
    <div class="silver-frame">
        <div id="silverScroller" class="silver-scroll"></div>
    </div>
</div>

<script>
    // ========== CONFIG ==========
    const API_URL = "https://script.google.com/macros/s/AKfycbyWVP3ZJZ_Hxhx5U2dWrzfvWRlcfemc7oOj6-mCniVkW5Sci2cusBJFy6ydnkNO4-pg/exec";

    // ========== GLOBAL DATA ==========
    let sheetMatches = [];
    let sheetStandings = [];
    let dailyPromos = [];
    let silverShouts = [];

    // ========== FETCH ALL DATA ==========
    async function fetchAllData() {
        try {
            const response = await fetch(`${API_URL}?action=all&t=${Date.now()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            console.log("Data loaded:", data);

            // Matches
            if (data.matches) {
                sheetMatches = data.matches.map(row => ({
                    date: row.Date || row.date || "",
                    team1: row["Team 1"] || row.Team1 || "",
                    team2: row["Team 2"] || row.Team2 || "",
                    score1: row["Score 1"] !== undefined && row["Score 1"] !== "" ? row["Score 1"] : null,
                    score2: row["Score 2"] !== undefined && row["Score 2"] !== "" ? row["Score 2"] : null,
                    status: row.Status || row.status || (row["Score 1"] ? "Finished" : "Upcoming"),
                    location: row.Location || row.location || ""
                }));
            }

            // Standings (COUNTRIES)
            if (data.standings) {
                sheetStandings = data.standings.map(row => ({
                    country: row.Country || row.country || "",
                    group: row.Group || row.group || "",
                    pos: row.Pos || row.pos || "",
                    pts: row.Pts || row.pts || 0,
                    w: row.W || row.w || 0,
                    d: row.D || row.d || 0,
                    l: row.L || row.l || 0,
                    gf: row.GF || row.gf || 0,
                    ga: row.GA || row.ga || 0,
                    wave: row.Wave || row["WAVE%"] || row.wave || 0,
                    analysis: row.Analysis || "",
                    lastMatch: row.LastMatch || "",
                    nextMatch: row.NextMatch || ""
                }));
            }

            // Daily Promos
            if (data.dailyPromo) {
                dailyPromos = data.dailyPromo.map(row => ({
                    Date: row.Date || row.date || "",
                    SponsorName: row.SponsorName || row.sponsorName || "",
                    ImageURL: row.ImageURL || row.imageURL || "",
                    Link: row.Link || row.link || "",
                    Message: row.Message || row.message || "",
                    Active: row.Active === true || row.Active === "TRUE" || row.Active === true
                }));
            }

            // Silver shouts (from SPONSORS with tier "silver")
            if (data.sponsors) {
                silverShouts = data.sponsors
                    .filter(s => s.Tier && s.Tier.toLowerCase() === "silver")
                    .map(s => ({ name: s.SponsorName || s.name, message: s.ChallengeTeaser || s.message || "Supporting Curaçao!" }));
            }

            return true;
        } catch (error) {
            console.error("Fetch error:", error);
            return false;
        }
    }

    // ========== RENDER FUNCTIONS ==========

    // Results (all finished)
    function renderResults() {
        const container = document.getElementById("resultsContent");
        if (!container) return;
        const finished = sheetMatches.filter(m => m.status === "Finished" || (m.score1 !== null));
        if (!finished.length) { container.innerHTML = "<div class='loading'>No finished matches</div>"; return; }
        container.innerHTML = finished.map(m => `
            <div class="match-item">
                <div class="match-date">📅 ${m.date}</div>
                <div class="match-teams">
                    <span>${m.team1}</span>
                    <span class="match-score">${m.score1 ?? '?'} - ${m.score2 ?? '?'}</span>
                    <span>${m.team2}</span>
                </div>
                <div>📍 ${m.location}</div>
            </div>
        `).join('');
    }

    // Today's matches
    function renderToday() {
        const container = document.getElementById("todayContent");
        if (!container) return;
        const today = new Date().toISOString().split('T')[0];
        const todayMatches = sheetMatches.filter(m => m.date === today);
        if (!todayMatches.length) { container.innerHTML = "<div class='loading'>No matches today</div>"; return; }
        container.innerHTML = todayMatches.map(m => `
            <div class="match-item">
                <div class="match-date">📅 ${m.date}</div>
                <div class="match-teams">
                    <span>${m.team1}</span>
                    ${m.score1 !== null ? `<span class="match-score">${m.score1} - ${m.score2}</span>` : '<span>🆚</span>'}
                    <span>${m.team2}</span>
                </div>
                <div>📍 ${m.location}</div>
            </div>
        `).join('');
    }

    // Group E Standings
    function renderStandings() {
        const container = document.getElementById("standingsContent");
        if (!container) return;
        const groupE = sheetStandings.filter(t => t.group === "E" || t.group === "E");
        if (!groupE.length) { container.innerHTML = "<div class='loading'>No Group E data</div>"; return; }
        groupE.sort((a,b) => (a.pos||99) - (b.pos||99));
        let html = `<div class="group-header">Group E</div><table class="standings-table"><tr><th>Pos</th><th>Team</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Wave%</th></tr>`;
        groupE.forEach(t => {
            html += `<tr><td>${t.pos}</td><td style="text-align:left;font-weight:600;">${t.country}</td><td>${t.pts}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.wave||0}%</td></tr>`;
        });
        html += `</table>`;
        container.innerHTML = html;
    }

    // Next Round (Placeholder – you can define logic later)
    function renderNextRound() {
        const container = document.getElementById("nextroundContent");
        container.innerHTML = `<div class="loading">Next round info coming soon...</div>`;
    }

    // Facts
    function renderFacts() {
        const container = document.getElementById("factsContent");
        container.innerHTML = `
            <ul style="list-style:none; padding:0;">
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🏆 Curaçao's first World Cup!</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">⚽ Germany 7-1 Curaçao (opener)</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🌊 Blue Wave Stadium seats 45,000</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🇨🇼 Curaçao scored in 19'28" vs Germany</li>
            </ul>
        `;
    }

    // ========== DAILY PROMOS ==========
    let selectedDate = new Date().toISOString().split('T')[0];

    function renderCalendar() {
        const container = document.getElementById("calendarContainer");
        if (!container) return;
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();

        let html = `<div style="font-weight:700; margin-bottom:8px;">${today.toLocaleString('default', { month: 'long', year: 'numeric' })}</div><div class="calendar-grid">`;
        // Day names
        ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => html += `<div style="font-size:10px; text-align:center;">${d}</div>`);
        for (let i=0; i<firstDay; i++) html += `<div></div>`;
        for (let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasPromo = dailyPromos.some(p => p.Date === dateStr && p.Active);
            const isSelected = dateStr === selectedDate;
            html += `<div class="calendar-day ${isSelected?'selected':''} ${hasPromo?'has-promo':''}" data-date="${dateStr}">${d}</div>`;
        }
        html += `</div>`;
        container.innerHTML = html;

        // Add click events
        container.querySelectorAll('.calendar-day').forEach(el => {
            el.addEventListener('click', function() {
                selectedDate = this.dataset.date;
                renderCalendar();
                renderPromoList();
            });
        });
    }

    function renderPromoList() {
        const container = document.getElementById("promoList");
        if (!container) return;
        const promos = dailyPromos.filter(p => p.Date === selectedDate && p.Active);
        if (!promos.length) {
            container.innerHTML = `<div class="loading">No promos for ${selectedDate}</div>`;
            return;
        }
        container.innerHTML = promos.map(p => `
            <div class="promo-card" onclick="window.open('${p.Link || '#'}', '_blank')">
                <img src="${p.ImageURL || 'https://placehold.co/800x200/ffcd3c/002b54?text=Promo'}" alt="${p.SponsorName}">
                <div class="promo-info">
                    <span class="promo-name">${p.SponsorName}</span>
                    <span class="promo-link">🔗 Tap</span>
                </div>
                ${p.Message ? `<div style="padding:0 12px 12px; font-size:13px; color:#555;">${p.Message}</div>` : ''}
            </div>
        `).join('');
    }

    // ========== ADD PROMO FORM ==========
    function toggleAddPromoForm(show) {
        document.getElementById('addPromoForm').style.display = show ? 'block' : 'none';
    }

    document.getElementById('showAddPromoBtn').addEventListener('click', () => {
        toggleAddPromoForm(true);
    });
    document.getElementById('cancelPromoBtn').addEventListener('click', () => {
        toggleAddPromoForm(false);
    });

    // Character counter
    document.getElementById('promoMessage').addEventListener('input', function() {
        document.getElementById('charCount').textContent = this.value.length;
    });

    // Submit promo via WhatsApp
    document.getElementById('submitPromoBtn').addEventListener('click', function() {
        const date = document.getElementById('promoDate').value;
        const name = document.getElementById('promoName').value.trim();
        const image = document.getElementById('promoImage').value.trim();
        const link = document.getElementById('promoLink').value.trim();
        const message = document.getElementById('promoMessage').value.trim();
        if (!name) { alert('Please enter Sponsor Name'); return; }
        const msg = `📢 New Promo Request:\nDate: ${date}\nName: ${name}\nImage: ${image}\nLink: ${link}\nMessage: ${message}\n${message.length > 100 ? ' (Unlimited - XCG 75)' : ' (100 char limit)'}`;
        window.open(`https://wa.me/59995120536?text=${encodeURIComponent(msg)}`, '_blank');
    });

    // ========== SILVER SHOUTOUTS ==========
    function renderSilver() {
        const container = document.getElementById("silverScroller");
        if (!container) return;
        const base = ["💙 One love, Curaçao! 🇨🇼", "⚽ First World Cup in Curaçao!", "🌊 Blue Wave forever!", "🇨🇼 Proud to be Curaçaoan!"];
        const extras = silverShouts.map(s => `${s.name}: ${s.message}`);
        const all = [...base, ...extras];
        const doubled = [...all, ...all];
        container.innerHTML = doubled.map(msg => `<div class="silver-item">⚽ ${msg}</div>`).join('');
    }

    // ========== NAVIGATION ==========
    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active-section'));
        document.getElementById(`section-${sectionId}`).classList.add('active-section');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.nav-btn[data-section="${sectionId}"]`).classList.add('active');

        // Render content when switching
        switch(sectionId) {
            case 'results': renderResults(); break;
            case 'today': renderToday(); break;
            case 'standings': renderStandings(); break;
            case 'nextround': renderNextRound(); break;
            case 'facts': renderFacts(); break;
            case 'promos': renderCalendar(); renderPromoList(); break;
        }
    }

    // ========== ENTER APP ==========
    function enterApp() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('appWrapper').style.display = 'block';
        // Load all data and render default
        fetchAllData().then(() => {
            renderSilver();
            showSection('results');
        });
    }

    // ========== EVENT LISTENERS ==========
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('enterAppBtn').addEventListener('click', enterApp);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                showSection(this.dataset.section);
            });
        });

        // Preload data for instant show after enter
        fetchAllData().then(() => {
            renderSilver();
            // Pre-render initial sections
            renderResults();
            renderToday();
            renderStandings();
            renderNextRound();
            renderFacts();
            renderCalendar();
            renderPromoList();
        });
    });
</script>
</body>
</html>
