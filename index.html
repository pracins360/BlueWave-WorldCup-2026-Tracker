<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Blue Wave · World Cup Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            background: #eef3fc;
            min-height: 100vh;
        }
        #landingPage {
            display: block;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #001e3c, #002b54);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .banner-container {
            max-width: 500px;
            width: 100%;
            border-radius: 32px;
            overflow: hidden;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .enter-btn {
            background: #ffcd3c;
            border: none;
            width: 100%;
            max-width: 320px;
            margin: 30px auto 0;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #00264d;
            border-radius: 60px;
            cursor: pointer;
        }
        .enter-btn:hover { background: #ffdd77; transform: scale(0.98); }
        #appWrapper {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background: #f8fafd;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .app-header {
            background: #002b54;
            padding: 16px;
            text-align: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .app-header h2 { font-size: 1.5rem; letter-spacing: 1px; }
        .app-header p { font-size: 0.75rem; opacity: 0.85; }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 14px;
            background: white;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 70px;
            z-index: 9;
        }
        .nav-btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 4px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 11px;
            color: #002b54;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .nav-btn.active { background: #002b54; color: white; }
        .section {
            display: none;
            padding: 16px;
        }
        .section.active-section { display: block; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #002b54;
            border-left: 5px solid #ffcd3c;
            padding-left: 12px;
            margin-bottom: 16px;
        }
        .match-item {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .match-date { font-size: 11px; color: #2c6e9e; font-weight: 600; }
        .match-teams {
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .match-score { background: #e9f0f9; padding: 4px 12px; border-radius: 40px; }
        .standings-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .standings-table th { background: #002b54; color: white; padding: 8px 4px; text-align: center; }
        .standings-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .group-header { background: #ffcd3c; color: #002b54; font-weight: 800; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; }
        .silver-frame {
            background: #002b54;
            padding: 12px;
            overflow: hidden;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            z-index: 20;
        }
        .silver-scroll {
            display: flex;
            gap: 36px;
            white-space: nowrap;
            animation: scrollMarquee 22s linear infinite;
        }
        .silver-item { color: #ffdd99; font-size: 13px; }
        @keyframes scrollMarquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
        .loading { text-align: center; padding: 28px; color: #888; }
        .error-box {
            background: #fde8e8;
            border: 2px solid #e74c3c;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            color: #c0392b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- LANDING PAGE -->
<div id="landingPage">
    <div class="banner-container">
        <img src="https://i.ibb.co/KxtD3C2w/banner-world-cup-app.png" alt="Blue Wave 2026">
    </div>
    <button class="enter-btn" id="enterAppBtn">⚽ SEE MATCH RESULTS ⚽</button>
</div>

<!-- MAIN APP -->
<div id="appWrapper">
    <div class="app-header">
        <h2>🌊 BLUE WAVE 2026</h2>
        <p>Curaçao World Cup Tracker</p>
    </div>
    <div class="nav-grid">
        <button class="nav-btn active" data-section="results">📋 Results</button>
        <button class="nav-btn" data-section="today">📅 Today</button>
        <button class="nav-btn" data-section="standings">🏆 Group E</button>
        <button class="nav-btn" data-section="upcoming">⏭️ Upcoming</button>
        <button class="nav-btn" data-section="facts">📖 Facts</button>
    </div>

    <div id="section-results" class="section active-section">
        <div class="card"><div class="card-title">📋 All Results</div><div id="resultsContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-today" class="section">
        <div class="card"><div class="card-title">📅 Today's Matches</div><div id="todayContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-standings" class="section">
        <div class="card"><div class="card-title">🏆 Group E Standings</div><div id="standingsContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-upcoming" class="section">
        <div class="card"><div class="card-title">⏭️ Upcoming Matches</div><div id="upcomingContent" class="loading">Loading...</div></div>
    </div>
    <div id="section-facts" class="section">
        <div class="card"><div class="card-title">📖 Facts</div><div id="factsContent" class="loading">Loading...</div></div>
    </div>

    <div class="silver-frame">
        <div id="silverScroller" class="silver-scroll"></div>
    </div>
</div>

<script>
    // ========== 🔧 YOUR API URL - UPDATE THIS ==========
    const API_URL = "https://script.google.com/macros/s/AKfycbyWVP3ZJZ_Hxhx5U2dWrzfvWRlcfemc7oOj6-mCniVkW5Sci2cusBJFy6ydnkNO4-pg/exec";

    // ========== GLOBAL DATA ==========
    let sheetData = { matches: [], standings: [], sponsors: [], dailyPromo: [] };
    let dataLoaded = false;
    let loadError = null;

    // ========== FETCH DATA FROM SHEET ==========
    async function fetchSheetData() {
        console.log("📡 FETCHING from:", API_URL);
        
        try {
            const response = await fetch(`${API_URL}?action=all&t=${Date.now()}`);
            console.log("📡 Response status:", response.status);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const rawData = await response.text();
            console.log("📡 Raw response (first 200 chars):", rawData.substring(0, 200));
            
            let data;
            try {
                data = JSON.parse(rawData);
            } catch (parseError) {
                console.error("❌ JSON parse error:", parseError);
                throw new Error("Invalid JSON response from sheet");
            }
            
            console.log("✅ Data parsed:", data);
            
            sheetData = {
                matches: data.matches || [],
                standings: data.standings || [],
                sponsors: data.sponsors || [],
                dailyPromo: data.dailyPromo || []
            };
            dataLoaded = true;
            loadError = null;
            console.log(`✅ Loaded: ${sheetData.matches.length} matches, ${sheetData.standings.length} standings`);
            return true;
            
        } catch (error) {
            console.error("❌ Fetch error:", error);
            loadError = error.message;
            dataLoaded = false;
            return false;
        }
    }

    // ========== RENDER FUNCTIONS ==========
    function renderResults() {
        const container = document.getElementById("resultsContent");
        if (!container) return;
        if (!dataLoaded) {
            container.innerHTML = `<div class="error-box">❌ ${loadError || 'Data not loaded'}</div>`;
            return;
        }
        const matches = sheetData.matches || [];
        if (!matches.length) {
            container.innerHTML = "<div class='loading'>No matches found in sheet</div>";
            return;
        }
        const finished = matches.filter(m => m.status === "Finished" || m["Score 1"]);
        if (!finished.length) {
            container.innerHTML = "<div class='loading'>No finished matches yet</div>";
            return;
        }
        container.innerHTML = finished.map(m => {
            const date = m.date || m.Date || "TBD";
            const team1 = m.team1 || m["Team 1"] || "?";
            const team2 = m.team2 || m["Team 2"] || "?";
            const score1 = m.score1 ?? m["Score 1"] ?? "?";
            const score2 = m.score2 ?? m["Score 2"] ?? "?";
            const location = m.location || m.Location || "Stadium";
            return `<div class="match-item">
                <div class="match-date">📅 ${date}</div>
                <div class="match-teams">
                    <span>${team1}</span>
                    <span class="match-score">${score1} - ${score2}</span>
                    <span>${team2}</span>
                </div>
                <div>📍 ${location}</div>
            </div>`;
        }).join('');
    }

    function renderToday() {
        const container = document.getElementById("todayContent");
        if (!container) return;
        if (!dataLoaded) {
            container.innerHTML = `<div class="error-box">❌ ${loadError || 'Data not loaded'}</div>`;
            return;
        }
        const matches = sheetData.matches || [];
        const today = new Date().toISOString().split('T')[0];
        const todayMatches = matches.filter(m => (m.date || m.Date) === today);
        if (!todayMatches.length) {
            container.innerHTML = "<div class='loading'>No matches today</div>";
            return;
        }
        container.innerHTML = todayMatches.map(m => {
            const date = m.date || m.Date || "TBD";
            const team1 = m.team1 || m["Team 1"] || "?";
            const team2 = m.team2 || m["Team 2"] || "?";
            const score1 = m.score1 ?? m["Score 1"];
            const score2 = m.score2 ?? m["Score 2"];
            const location = m.location || m.Location || "TBD";
            const scoreDisplay = (score1 !== null && score1 !== "") ? `<span class="match-score">${score1} - ${score2}</span>` : '<span>🆚</span>';
            return `<div class="match-item">
                <div class="match-date">📅 ${date}</div>
                <div class="match-teams">
                    <span>${team1}</span>
                    ${scoreDisplay}
                    <span>${team2}</span>
                </div>
                <div>📍 ${location}</div>
            </div>`;
        }).join('');
    }

    function renderStandings() {
        const container = document.getElementById("standingsContent");
        if (!container) return;
        if (!dataLoaded) {
            container.innerHTML = `<div class="error-box">❌ ${loadError || 'Data not loaded'}</div>`;
            return;
        }
        const standings = sheetData.standings || [];
        if (!standings.length) {
            container.innerHTML = "<div class='loading'>No standings found</div>";
            return;
        }
        const groupE = standings.filter(t => (t.Group || t.group || "").toUpperCase() === "E");
        if (!groupE.length) {
            container.innerHTML = "<div class='loading'>No Group E data found</div>";
            return;
        }
        groupE.sort((a,b) => (parseInt(a.Pos || a.pos || 99)) - (parseInt(b.Pos || b.pos || 99)));
        let html = `<div class="group-header">Group E</div><table class="standings-table"><tr><th>Pos</th><th>Team</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Wave%</th></tr>`;
        groupE.forEach(t => {
            const pos = t.Pos || t.pos || "-";
            const country = t.Country || t.country || "?";
            const pts = t.Pts || t.pts || 0;
            const w = t.W || t.w || 0;
            const d = t.D || t.d || 0;
            const l = t.L || t.l || 0;
            const gf = t.GF || t.gf || 0;
            const ga = t.GA || t.ga || 0;
            const wave = t.Wave || t["WAVE%"] || t.wave || 0;
            html += `<tr><td>${pos}</td><td style="text-align:left;font-weight:600;">${country}</td><td>${pts}</td><td>${w}</td><td>${d}</td><td>${l}</td><td>${gf}</td><td>${ga}</td><td>${wave}%</td></tr>`;
        });
        html += `</table>`;
        container.innerHTML = html;
    }

    function renderUpcoming() {
        const container = document.getElementById("upcomingContent");
        if (!container) return;
        if (!dataLoaded) {
            container.innerHTML = `<div class="error-box">❌ ${loadError || 'Data not loaded'}</div>`;
            return;
        }
        const matches = sheetData.matches || [];
        const upcoming = matches.filter(m => 
            (m.status === "Upcoming" || m.status === "Scheduled") &&
            (m.score1 === null || m.score1 === "" || m["Score 1"] === null || m["Score 1"] === "")
        );
        if (!upcoming.length) {
            container.innerHTML = "<div class='loading'>No upcoming matches</div>";
            return;
        }
        container.innerHTML = upcoming.map(m => {
            const date = m.date || m.Date || "TBD";
            const team1 = m.team1 || m["Team 1"] || "?";
            const team2 = m.team2 || m["Team 2"] || "?";
            const location = m.location || m.Location || "TBD";
            return `<div class="match-item">
                <div class="match-date">📅 ${date}</div>
                <div class="match-teams">
                    <span>${team1}</span>
                    <span>🆚</span>
                    <span>${team2}</span>
                </div>
                <div>📍 ${location}</div>
            </div>`;
        }).join('');
    }

    function renderFacts() {
        document.getElementById("factsContent").innerHTML = `
            <ul style="list-style:none; padding:0;">
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🏆 Curaçao's first World Cup!</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">⚽ Germany 7-1 Curaçao (opener)</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🌊 Blue Wave Stadium seats 45,000</li>
                <li style="padding:12px; background:#f1f5f9; border-radius:12px; margin-bottom:8px;">🇨🇼 Curaçao scored in 19'28" vs Germany</li>
            </ul>
        `;
    }

    function renderSilver() {
        const container = document.getElementById("silverScroller");
        if (!container) return;
        const base = ["💙 One love, Curaçao! 🇨🇼", "⚽ First World Cup in Curaçao!", "🌊 Blue Wave forever!", "🇨🇼 Proud to be Curaçaoan!"];
        let messages = [...base];
        if (dataLoaded && sheetData.sponsors) {
            const silver = sheetData.sponsors.filter(s => (s.Tier || s.tier || "").toLowerCase() === "silver");
            silver.forEach(s => {
                const name = s.SponsorName || s.name || "Supporter";
                const msg = s.ChallengeTeaser || s.message || "Supporting Curaçao!";
                messages.push(`${name}: ${msg}`);
            });
        }
        const doubled = [...messages, ...messages];
        container.innerHTML = doubled.map(msg => `<div class="silver-item">⚽ ${msg}</div>`).join('');
    }

    // ========== NAVIGATION ==========
    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active-section'));
        document.getElementById(`section-${sectionId}`).classList.add('active-section');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.nav-btn[data-section="${sectionId}"]`).classList.add('active');
        switch(sectionId) {
            case 'results': renderResults(); break;
            case 'today': renderToday(); break;
            case 'standings': renderStandings(); break;
            case 'upcoming': renderUpcoming(); break;
            case 'facts': renderFacts(); break;
        }
    }

    // ========== ENTER APP ==========
    function enterApp() {
        console.log("🚀 ENTER APP clicked!");
        const landing = document.getElementById('landingPage');
        const app = document.getElementById('appWrapper');
        landing.style.display = 'none';
        app.style.display = 'block';
        
        document.querySelectorAll('.section .card .loading').forEach(el => {
            if (el) el.textContent = 'Loading from sheet...';
        });
        
        fetchSheetData().then(() => {
            renderSilver();
            renderResults();
            renderToday();
            renderStandings();
            renderUpcoming();
            renderFacts();
            showSection('results');
        });
    }

    // ========== EVENT LISTENERS ==========
    document.addEventListener('DOMContentLoaded', function() {
        console.log("🚀 DOM loaded");
        document.getElementById('enterAppBtn').addEventListener('click', enterApp);
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const section = this.dataset.section;
                if (section) showSection(section);
            });
        });
        fetchSheetData().then(() => {
            renderSilver();
            console.log("✅ Pre-load complete");
        });
    });

    // Expose for debugging
    window.testFetch = fetchSheetData;
    console.log("✅ Script loaded. Click 'SEE MATCH RESULTS'");
</script>
</body>
</html>
