<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Wave</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef4ff;
    margin: 0;
    padding: 0;
  }

  header {
    background: #0057b8;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
  }

  .tabs {
    display: flex;
    background: #003a7a;
  }

  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    color: white;
    cursor: pointer;
  }

  .tab.active {
    background: #ffd23f;
    color: #003a7a;
    font-weight: bold;
  }

  .section {
    padding: 15px;
    display: none;
  }

  .hidden {
    display: none;
  }

  .card {
    background: white;
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .sponsor-item {
    background: #fff;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .link-pill {
    background: #0057b8;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-block;
    margin-left: 5px;
    cursor: pointer;
  }

  pre {
    background: #f4f4f4;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
  }
</style>
</head>

<body>

<header>BLUE WAVE</header>

<div class="tabs">
  <div class="tab" onclick="showSection('results')">Results</div>
  <div class="tab" onclick="showSection('calendar')">Calendar</div>
  <div class="tab" onclick="showSection('bracket')">Bracket</div>
  <div class="tab" onclick="showSection('facts')">Facts</div>
</div>

<!-- COUNTRY CARD -->
<div id="countryCard" class="card hidden">
  <h2 id="countryName"></h2>
  <div id="countryFlag" style="font-size:40px;"></div>

  <p><b>Group:</b> <span id="countryGroup"></span></p>
  <p><b>Position:</b> <span id="countryPos"></span></p>
  <p><b>Points:</b> <span id="countryPts"></span></p>
  <p><b>GF:</b> <span id="countryGF"></span></p>
  <p><b>GA:</b> <span id="countryGA"></span></p>
  <p><b>Last Match:</b> <span id="countryLast"></span></p>

  <div>
    <b>WAVE %:</b> <span id="waveValue"></span>
    <div style="background:#ddd;width:100%;height:10px;border-radius:5px;">
      <div id="waveFill" style="background:#0057b8;height:10px;width:0%;border-radius:5px;"></div>
    </div>
  </div>

  <p id="countryAnalysis"></p>
</div>

<!-- LOYALTY CARD -->
<div id="loyaltyCard" class="card hidden">
  <h3>Loyalty Match</h3>
  <p><b>Team A:</b> <span id="loyaltyTeamA"></span></p>
  <p><b>Team B:</b> <span id="loyaltyTeamB"></span></p>
  <p><b>Result:</b> <span id="loyaltyResult"></span></p>
  <p><b>Voucher:</b> <span id="loyaltyVoucher"></span></p>
</div>

<!-- SPONSORS -->
<div class="card">
  <h3>Sponsors</h3>
  <div id="sponsorList"></div>
</div>

<!-- CHALLENGE -->
<div id="challengeCard" class="card hidden">
  <h3 id="challengeTitle"></h3>
  <p id="challengeTeaser"></p>
  <button id="challengeLink" onclick="openChallenge()">Open Challenge</button>
</div>

<!-- RESULTS -->
<div id="section-results" class="section">
  <h2>Results</h2>
  <pre id="resultsContent"></pre>
</div>

<!-- CALENDAR -->
<div id="section-calendar" class="section">
  <h2>Calendar</h2>
  <pre id="calendarContent"></pre>
</div>

<!-- BRACKET -->
<div id="section-bracket" class="section">
  <h2>Bracket</h2>
  <pre id="bracketContent"></pre>
</div>

<!-- FACTS -->
<div id="section-facts" class="section">
  <h2>Facts</h2>
  <pre id="factsContent"></pre>
</div>

<script src="script.js"></script>

</body>
</html>
