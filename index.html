  <div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
      <div class="brand-block">
        <div class="brand-title">Blue Wave Challenge</div>
        <div class="brand-subtitle">Live Stats • Sponsors • Loyalty • Predictions</div>
      </div>

      <div class="header-right">
        <div class="pill flag-pill">
          <span class="flag">🇨🇼</span>
          <span>Curaçao</span>
        </div>
        <div class="pill">v1.0</div>
      </div>
    </header>

      <!-- LEFT SIDE: COUNTRY VIEW -->
      <div id="countryView">

        <div id="countryCard" class="card hidden">

            <div class="country-name">

              <span id="countryName">Country</span>
            </div>
            <button class="secondary" onclick="goHome()">Home</button>
          </div>

          <div class="country-meta">
            <div>Group: <span id="countryGroup"></span></div>
            <div>Pos: <span id="countryPos"></span></div>
